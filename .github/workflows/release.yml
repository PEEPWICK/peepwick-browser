# Pushing a tag like v0.1.3a (alpha), v0.2.0b (beta) or v1.0.0 builds the Linux
# packages and publishes them as a GitHub release. Installed browsers pick the
# release up through electron-updater.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check that the tag matches package.json
        run: |
          expected="$(node scripts/release.mjs --print-tag)"
          if [ "${expected}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json (expected ${expected})" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build
        run: npm run dist
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shown="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.AppImage dist/*.deb dist/latest-linux.yml \
            --verify-tag \
            --title "PEEPWICK Browser ${shown}" \
            --generate-notes
