# Pushing a tag like v0.2.0a (alpha), v0.3.0b (beta) or v1.0.0 builds the Linux packages
# (a .deb and an AppImage, with Tauri) and publishes them as a GitHub release.
#
# While package.json has "githubPrerelease": true the release is marked as a pre-release:
# GitHub then keeps the last full release as "Latest", which is what installed 0.1.x
# (Electron) copies update to, so they don't move to a version that lacks their features.
#
# The packages are signed with the TAURI_SIGNING_PRIVATE_KEY secret, and the update list
# that installed 0.2.1a+ copies read (latest.json in the `updates` branch) points at them.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check that the tag matches package.json
        run: |
          expected="$(node scripts/release.mjs --print-tag)"
          if [ "${expected}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json (expected ${expected})" >&2
            exit 1
          fi
      # The AppImage carries the GStreamer plugins WebKitGTK plays media with (patchelf is
      # what linuxdeploy needs to bundle them); the .deb uses the system's.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build
        env:
          # linuxdeploy, which makes the AppImage, runs without FUSE on the runners.
          APPIMAGE_EXTRACT_AND_RUN: 1
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: npm run build
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shown="${GITHUB_REF_NAME#v}"
          bundle=src-tauri/target/release/bundle
          mkdir -p dist
          cp "${bundle}"/deb/*.deb "dist/peepwick-browser-${shown}-amd64.deb"
          cp "${bundle}"/deb/*.deb.sig "dist/peepwick-browser-${shown}-amd64.deb.sig"
          cp "${bundle}"/appimage/*.AppImage "dist/peepwick-browser-${shown}-x86_64.AppImage"
          cp "${bundle}"/appimage/*.AppImage.sig "dist/peepwick-browser-${shown}-x86_64.AppImage.sig"
          flags=()
          if [ "$(node -p "require('./package.json').githubPrerelease === true")" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag "${flags[@]}" \
            --title "PEEPWICK Browser ${shown}" \
            --generate-notes
      - name: Update list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shown="${GITHUB_REF_NAME#v}"
          node scripts/update-manifest.mjs "${GITHUB_REF_NAME}" \
            "dist/peepwick-browser-${shown}-amd64.deb.sig" \
            "dist/peepwick-browser-${shown}-x86_64.AppImage.sig" > latest.json
          args=(-X PUT "repos/${GITHUB_REPOSITORY}/contents/latest.json"
            -f "message=Update list for ${GITHUB_REF_NAME}"
            -f "content=$(base64 -w0 latest.json)"
            -f branch=updates)
          # Replacing the file needs its sha. The first release creates it: on that 404 gh
          # prints the error body to stdout, so go by the exit status, not the output.
          if sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/latest.json?ref=updates" --jq .sha 2>/dev/null)"; then
            args+=(-f "sha=${sha}")
          fi
          gh api "${args[@]}" > /dev/null
