# Keeps the toolchain current: one grouped pull request a week for each ecosystem.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Node types follow the Node version the build uses (Node 24), by hand.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      tauri:
        patterns:
          - '@tauri-apps/*'
      dependencies:
        patterns:
          - '*'
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # GTK 3 and WebKitGTK 4.1, which Tauri 2 builds on, end with these lines; newer ones
      # are for GTK 4 and don't fit together with Tauri.
      - dependency-name: gtk
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: glib
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: cairo-rs
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: javascriptcore-rs
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: webkit2gtk
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
    groups:
      tauri:
        patterns:
          - 'tauri'
          - 'tauri-*'
      dependencies:
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
