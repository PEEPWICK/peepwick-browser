# Keeps Electron and the rest of the toolchain current: one grouped pull request a week.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Node types follow the Node version bundled in Electron (Node 24 in Electron 45);
      # they move together with Electron's major version, by hand.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      electron:
        patterns:
          - electron
          - electron-*
          - '@electron/*'
      dependencies:
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
